<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexAI Enterprise 2.0</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { 
            background-color: #f3f5f8; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
        }
        .header-bg { 
            background: linear-gradient(180deg, #234882 0%, #1e3c72 100%); 
            color: white; 
            padding: 45px 20px 85px 20px; 
            text-align: center;
        }
        .header-bg h1 {
            font-weight: 800;
            font-size: 2.8rem;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .header-bg p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 400;
        }
        .main-container {
            margin-top: -60px;
            margin-bottom: 50px;
        }
        .card-custom { 
            border: none; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            background: #ffffff;
            padding: 35px 40px;
        }
        .form-label-custom {
            font-weight: 700;
            color: #2c3e50;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }
        .file-drop-area {
            border: 1.5px dashed #b0bec5;
            border-radius: 8px;
            padding: 12px 15px;
            background-color: #f8fafc;
        }
        .form-control-custom {
            border-radius: 6px;
            border: 1px solid #ced4da;
            height: 45px;
            font-size: 0.95rem;
        }
        .form-control-custom:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        .btn-submit { 
            background-color: #1a3b70; 
            border: none; 
            font-weight: 700; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 1.05rem;
            transition: all 0.2s ease;
        }
        .btn-submit:hover { 
            background-color: #122a52; 
        }
        .text-small-muted {
            font-size: 0.82rem;
            color: #78909c;
            margin-top: 6px;
        }
        .custom-control-label {
            font-size: 0.9rem;
            color: #546e7a;
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- CABECERA AZUL -->
<div class="header-bg">
    <div class="container">
        <h1>LexAI Enterprise 2.0</h1>
        <p>Plataforma de Análisis e Inteligencia Documental con Control Normativo</p>
    </div>
</div>

<!-- TARJETA FLOTANTE CENTRADA -->
<div class="container main-container">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="card card-custom">
                <form action="/" method="POST" enctype="multipart/form-data">
                    
                    <!-- 1. SUBIDA DE ARCHIVO -->
                    <div class="form-group mb-4">
                        <label for="file" class="form-label-custom">Documento PDF (Máximo 50 páginas):</label>
                        <div class="file-drop-area">
                            <input type="file" class="form-control-file" id="file" name="file" accept=".pdf" required>
                        </div>
                        <div class="text-small-muted">Asegúrate de que el PDF tenga texto seleccionable.</div>
                    </div>

                    <!-- 2. CATEGORÍA DEL DOCUMENTO -->
                    <div class="form-group mb-4">
                        <label for="categoria" class="form-label-custom">Categoría del Documento:</label>
                        <select class="form-control form-control-custom" id="categoria" name="categoria">
                            <option value="Inmobiliario / Contratos">Inmobiliario / Contratos</option>
                            <option value="Legal / Judicial / Laboral">Legal / Judicial / Laboral</option>
                            <option value="Financiero / Facturación">Financiero / Facturación</option>
                            <option value="Educación / Académico">Educación / Académico</option>
                            <option value="General / Otros">General / Otros</option>
                        </select>
                    </div>

                    <!-- 3. CHECKBOX ANONIMIZACIÓN -->
                    <div class="form-group mb-4">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="anonimizar_datos" name="anonimizar_datos" checked>
                            <label class="custom-control-label" for="anonimizar_datos">
                                🔒 Activar modo anonimización sensible (Redactar DNI, NIE, Emails y Teléfonos)
                            </label>
                        </div>
                    </div>

                    <!-- BOTÓN PRINCIPAL -->
                    <button type="submit" class="btn btn-primary btn-block btn-submit text-white">
                        Analizar Documento
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
