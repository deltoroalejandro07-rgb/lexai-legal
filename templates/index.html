<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexAI Enterprise 2.0</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 40px 0; margin-bottom: 30px; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-primary-custom { background-color: #1e3c72; border: none; font-weight: 600; padding: 12px 25px; border-radius: 8px; }
        .btn-primary-custom:hover { background-color: #162d56; }
        .role-group { display: none; }
    </style>
</head>
<body>

<div class="hero-section text-center">
    <div class="container">
        <h1 class="display-4 font-weight-bold">LexAI Enterprise 2.0</h1>
        <p class="lead">Plataforma de Análisis e Inteligencia Documental con Control Normativo</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-custom p-4">
                <form action="/" method="POST" enctype="multipart/form-data">
                    
                    <!-- SUBIDA DE ARCHIVO -->
                    <div class="form-group mb-4">
                        <label for="file" class="font-weight-bold text-dark">Documento PDF (Máximo 50 páginas):</label>
                        <input type="file" class="form-control-file p-2 style-file" id="file" name="file" accept=".pdf" required style="border: 2px dashed #ccc; border-radius: 8px;">
                        <small class="form-text text-muted">Asegúrate de que el PDF tenga texto seleccionable.</small>
                    </div>

                    <!-- SELECTOR DE CATEGORÍA -->
                    <div class="form-group mb-4">
                        <label for="categoria" class="font-weight-bold text-dark">Categoría del Documento:</label>
                        <select class="form-control" id="categoria" onchange="mostrarRoles()">
                            <option value="inmobiliario">Inmobiliario / Contratos</option>
                            <option value="legal">Legal / Judicial / Laboral</option>
                            <option value="financiero">Financiero / Facturación</option>
                            <option value="educacion">Educación / Académico</option>
                            <option value="general">General / Otros</option>
                        </select>
                    </div>

                    <!-- SELECTOR DE ROLES DINÁMICO -->
                    <div class="form-group mb-4">
                        <label for="rol_usuario_select" class="font-weight-bold text-dark">Rol o Perspectiva del Análisis:</label>
                        <input type="hidden" name="rol_usuario" id="rol_usuario_final" value="Comprador / Inversor">
                        
                        <!-- Inmobiliario -->
                        <div id="group_inmobiliario" class="role-group">
                            <select class="form-control" id="select_inmobiliario" onchange="actualizarRolFinal(this)">
                                <option value="Comprador / Inversor">Comprador / Inversor</option>
                                <option value="Vendedor / Propietario">Vendedor / Propietario</option>
                                <option value="Arrendatario / Inquilino">Arrendatario / Inquilino</option>
                                <option value="Arrendador / Propietario">Arrendador / Propietario</option>
                                <option value="Gestor / Asesor profesional">Gestor / Asesor profesional</option>
                            </select>
                        </div>

                        <!-- Legal -->
                        <div id="group_legal" class="role-group">
                            <select class="form-control" id="select_legal" onchange="actualizarRolFinal(this)">
                                <option value="Demandante / Parte Activa">Demandante / Parte Activa</option>
                                <option value="Demandado / Parte Pasiva">Demandado / Parte Pasiva</option>
                                <option value="Empleado / Trabajador">Empleado / Trabajador</option>
                                <option value="Empleador / Empresa">Empleador / Empresa</option>
                                <option value="Gestor / Asesor profesional">Gestor / Asesor profesional</option>
                            </select>
                        </div>

                        <!-- Financiero -->
                        <div id="group_financiero" class="role-group">
                            <select class="form-control" id="select_financiero" onchange="actualizarRolFinal(this)">
                                <option value="Cliente / Receptor del Servicio">Cliente / Receptor del Servicio</option>
                                <option value="Proveedor / Emisor de Factura">Proveedor / Emisor de Factura</option>
                                <option value="Contable / Auditor Interno">Contable / Auditor Interno</option>
                                <option value="Gestor / Asesor profesional">Gestor / Asesor profesional</option>
                            </select>
                        </div>

                        <!-- Educación -->
                        <div id="group_educacion" class="role-group">
                            <select class="form-control" id="select_educacion" onchange="actualizarRolFinal(this)">
                                <option value="Estudiante / Alumno">Estudiante / Alumno</option>
                                <option value="Profesor / Docente">Profesor / Docente</option>
                            </select>
                        </div>

                        <!-- General -->
                        <div id="group_general" class="role-group">
                            <select class="form-control" id="select_general" onchange="actualizarRolFinal(this)">
                                <option value="General / Neutro">General / Neutro</option>
                            </select>
                        </div>
                    </div>

                    <!-- ANONIMIZACIÓN Y RGPD -->
                    <div class="form-group form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="anonimizar_datos" name="anonimizar_datos">
                        <label class="form-check-label text-secondary" for="anonimizar_datos">
                            🔒 Activar modo anonimización sensible (Redactar DNI, NIE, Emails y Teléfonos)
                        </label>
                    </div>

                    <!-- BOTÓN DE ENVÍO -->
                    <button type="submit" class="btn btn-primary-custom btn-block btn-lg text-white">
                        Analizar Documento
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function mostrarRoles() {
    var cat = document.getElementById("categoria").value;
    var groups = document.getElementsByClassName("role-group");
    for (var i = 0; i < groups.length; i++) {
        groups[i].style.display = "none";
    }
    
    var activeGroup = document.getElementById("group_" + cat);
    if (activeGroup) {
        activeGroup.style.display = "block";
        var select = activeGroup.querySelector("select");
        actualizarRolFinal(select);
    }
}

function actualizarRolFinal(selectElement) {
    document.getElementById("rol_usuario_final").value = selectElement.value;
}

window.onload = function() {
    mostrarRoles();
};
</script>

</body>
</html>
