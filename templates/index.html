<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexAI Legal - Análisis de Documentos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; text-align: center; color: #333; }
        .container { max-width: 600px; background: white; padding: 30px; margin: 0 auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a2a3a; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        input[type="file"] { margin-bottom: 20px; font-size: 15px; }
        button { background-color: #0066cc; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0052a3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚖️ LexAI Legal</h1>
        <p>Sube un documento procesal en formato PDF para iniciar el análisis automático.</p>
        
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept=".pdf" required><br>
            <button type="submit">Analizar Documento</button>
        </form>
    </div>
</body>
</html>
