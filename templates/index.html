<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexAI Enterprise 2.0 - Análisis Seguro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; min-height: 100vh; display: flex; align-items: center; }
        .main-card { background: #ffffff; color: #1e293b; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .btn-custom { background: #2563eb; color: white; border-radius: 8px; font-weight: 600; padding: 12px 24px; }
        .btn-custom:hover { background: #1d4ed8; color: white; }
        .security-badge { background-color: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; font-size: 0.8rem; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 650px;">
        <div class="main-card p-4 p-md-5">
            <div class="text-center mb-4">
                <h1 class="h3 fw-bold text-primary"><i class="bi bi-shield-check me-2"></i>LexAI Enterprise 2.0</h1>
                <p class="text-muted small">Plataforma Segura con Verificación de Exactitud y Protección RGPD</p>
            </div>

            <form action="/" method="POST" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary"><i class="bi bi-person-badge me-1"></i> Selecciona tu rol en el documento:</label>
                    <select name="rol_usuario" class="form-select">
                        <option value="General / Neutro" selected>General / Análisis Neutro</option>
                        
                        <!-- SECCIÓN INMOBILIARIA Y CONTRATOS -->
                        <optgroup label="🏠 Inmobiliario y Alquileres">
                            <option value="Arrendatario / Inquilino">Arrendatario / Inquilino</option>
                            <option value="Arrendador / Propietario">Arrendador / Propietario</option>
                            <option value="Comprador / Cliente">Comprador / Cliente</option>
                        </optgroup>

                        <!-- SECCIÓN FINANCIERA Y FACTURACIÓN -->
                        <optgroup label="💶 Financiero y Facturación">
                            <option value="Cliente / Pagador (Receptor)">Cliente / Pagador (Receptor de Factura)</option>
                            <option value="Proveedor / Emisor (Cobrador)">Proveedor / Emisor (Cobrador)</option>
                            <option value="Contable / Auditor Fiscal">Contable / Auditor Fiscal</option>
                        </optgroup>

                        <!-- SECCIÓN LEGAL Y LABORAL -->
                        <optgroup label="⚖️ Legal, Judicial y Laboral">
                            <option value="Demandado / Acusado">Demandado / Acusado</option>
                            <option value="Demandante / Acusación">Demandante / Acusación</option>
                            <option value="Empleado / Trabajador">Empleado / Trabajador</option>
                            <option value="Empleador / Empresa">Empleador / Empresa</option>
                        </optgroup>

                        <!-- SECCIÓN EDUCACIÓN Y FORMACIÓN -->
                        <optgroup label="🎓 Educación y Estudio">
                            <option value="Estudiante / Opositor">Estudiante / Opositor</option>
                        </optgroup>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary"><i class="bi bi-file-earmark-pdf me-1"></i> Documento PDF a analizar:</label>
                    <input type="file" name="file" accept=".pdf" class="form-control" required>
                </div>

                <!-- OPCIÓN DE PRIVACIDAD / ANONIMIZACIÓN -->
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" name="anonimizar_datos" id="anonimizar_datos" checked>
                    <label class="form-check-label small fw-bold text-secondary" for="anonimizar_datos">
                        <i class="bi bi-incognito me-1"></i> Enmascarar automáticamente DNI, Teléfonos y Correos (RGPD)
                    </label>
                </div>

                <!-- NOTA DE SEGURIDAD EN MEMORIA -->
                <div class="security-badge mb-4">
                    <i class="bi bi-lock-fill me-1"></i> <strong>Procesamiento en RAM efímera:</strong> El archivo se procesa únicamente en la memoria volátil del servidor y se elimina de forma inmediata tras el análisis. Ningún documento queda almacenado.
                </div>

                <button type="submit" class="btn btn-custom w-100">
                    <i class="bi bi-cpu me-2"></i> Procesar, Verificar y Analizar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
