<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexAI Multi 2.0 - Inteligencia Documental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #f8fafc; min-height: 100vh; display: flex; align-items: center; }
        .main-card { background: #ffffff; color: #1e293b; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .btn-custom { background: #2563eb; color: white; border-radius: 8px; font-weight: 600; padding: 12px 24px; }
        .btn-custom:hover { background: #1d4ed8; color: white; }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 650px;">
        <div class="main-card p-4 p-md-5">
            <div class="text-center mb-4">
                <h1 class="h3 fw-bold text-primary"><i class="bi bi-cpu-fill me-2"></i>LexAI Multi 2.0</h1>
                <p class="text-muted small">Plataforma Multidisciplinar de Análisis Documental y Evaluación de Riesgos</p>
            </div>

            <form action="/" method="POST" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary"><i class="bi bi-person-badge me-1"></i> Selecciona tu rol en el documento:</label>
                    <select name="rol_usuario" class="form-select">
                        <option value="General / Neutro" selected>General / Análisis Neutro</option>
                        <option value="Arrendatario / Inquilino">Arrendatario / Inquilino</option>
                        <option value="Arrendador / Propietario">Arrendador / Propietario</option>
                        <option value="Demandado / Acusado">Demandado / Acusado</option>
                        <option value="Demandante / Acusación">Demandante / Acusación</option>
                        <option value="Empleado / Trabajador">Empleado / Trabajador</option>
                        <option value="Empleador / Empresa">Empleador / Empresa</option>
                        <option value="Comprador / Cliente">Comprador / Cliente</option>
                        <option value="Estudiante / Opositor">Estudiante / Opositor</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary"><i class="bi bi-file-earmark-pdf me-1"></i> Documento PDF a analizar:</label>
                    <input type="file" name="file" accept=".pdf" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-custom w-100">
                    <i class="bi bi-search me-2"></i> Procesar y Evaluar Documento
                </button>
            </form>
        </div>
    </div>
</body>
</html>
